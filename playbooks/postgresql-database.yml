---
- name: Configure PostgreSQL lab database
  hosts: postgres
  become: true

  vars:
    postgres_db_name: devops_lab
    postgres_app_user: devops_user
    postgres_app_password: ChangeMe123!

  tasks:
    - name: Create application user
      ansible.builtin.shell: >
        cd /tmp &&
        sudo -u postgres psql
        -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ postgres_app_user }}'"
        | grep -q 1
        ||
        sudo -u postgres psql
        -c "CREATE ROLE {{ postgres_app_user }}
        LOGIN PASSWORD '{{ postgres_app_password }}';"
      register: create_user_result
      changed_when: create_user_result.rc == 0 and
                    "CREATE ROLE" in create_user_result.stdout

    - name: Check whether database exists
      ansible.builtin.shell: >
        cd /tmp &&
        sudo -u postgres psql
        -tAc "SELECT 1 FROM pg_database
        WHERE datname='{{ postgres_db_name }}'"
      register: database_exists
      changed_when: false

    - name: Create application database
      ansible.builtin.shell: >
        cd /tmp &&
        sudo -u postgres createdb
        --owner={{ postgres_app_user }}
        {{ postgres_db_name }}
      when: database_exists.stdout | trim != "1"
